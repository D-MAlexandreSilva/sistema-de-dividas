
{% extends "base.html" %}

{% block titulo %}
Cadastrar Dívida - Xandão Finance
{% endblock %}

{% block conteudo %}

<div class="container">

    <div class="form-card">

        <h1>📌 Nova Dívida</h1>

        <p class="subtitulo">
            Adicione uma nova dívida ao seu controle financeiro
        </p>

        <form action="/painel" method="POST">

            <select name="tipo">
                <option>Contas da casa</option>
                <option>Transporte</option>
                <option>Cartão de credito</option>
                <option>Educação</option>
                <option>Pessoais</option>
            </select>

            <input type="text" name="descricao"
                   placeholder="Descrição" required>

            <input type="number" name="valor"
                   step="0.01" min="0"
                   placeholder="Valor da parcela" required>

            <input type="number" name="parcelas_total"
                   min="1" placeholder="Parcelas" required>

            <label>Vencimento</label>

            <input type="date" name="vencimento" required>

            <button type="submit">
                Salvar Dívida
            </button>

        </form>

        <div class="acoes-form">

            <a href="/dividas" class="btn-secundario">
                📊 Ver dívidas do mês
            </a>

            <a href="/menu" class="btn-terciario">
                ⬅ Voltar ao menu
            </a>

            <button type="button" id="ativar-notificacoes">
                🔔 Ativar notificações
            </button>

        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>
const VAPID_PUBLIC_KEY = {{ vapid_public_key | tojson }};

function urlBase64ToUint8Array(base64String) {

    const padding = '='.repeat((4 - base64String.length % 4) % 4);

    const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');

    const rawData = window.atob(base64);

    return Uint8Array.from(
        [...rawData].map(char => char.charCodeAt(0))
    );
}

document.getElementById("ativar-notificacoes")
    .addEventListener("click", async () => {

    try {

        if (!("Notification" in window) ||
            !("serviceWorker" in navigator)) {

            alert("Seu navegador não suporta notificações.");
            return;
        }

        const permissao = await Notification.requestPermission();

        if (permissao !== "granted") {

            alert("Permissão para notificações não concedida.");
            return;
        }

        const registro = await navigator.serviceWorker.ready;

        let inscricao = await registro.pushManager.getSubscription();

        if (!inscricao) {

            inscricao = await registro.pushManager.subscribe({

                userVisibleOnly: true,

                applicationServerKey:
                    urlBase64ToUint8Array(VAPID_PUBLIC_KEY)

            });
        }

        const resposta = await fetch("/save-subscription", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "same-origin",

            body: JSON.stringify(inscricao)

        });

        const resultado = await resposta.json();

        if (!resposta.ok || !resultado.ok) {

            throw new Error("Não foi possível salvar a inscrição.");
        }

        alert("Notificações ativadas com sucesso!");

    } catch (erro) {

        console.error("Erro nas notificações:", erro);

        alert("Erro ao ativar notificações. Consulte o console.");
    }

});
</script>

{% endblock %}
