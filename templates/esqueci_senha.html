<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="manifest" href="/static/manifest.json">

<meta name="theme-color" content="#0f172a">

<link rel="icon"
      href="{{ url_for('static', filename='icon/icon.png') }}">

<title>Alterar Senha - Xandão Finance</title>

</head>

<body>

<div class="pagina-cadastro">

<div class="lado-esquerdo">

    <img
        src="{{ url_for('static', filename='icon/icon.png') }}"
        class="logo-principal"
        alt="Xandão Finance">

    <h1>Xandão Finance</h1>

    <p>
        Assuma o controle da sua vida financeira.
        Acompanhe gastos, dívidas e mantenha seus
        objetivos sempre à vista.
    </p>

    <div class="versiculo-login">

        <p>
            "Os planos do diligente conduzem à abundância,
            mas todo precipitado acaba na pobreza."
        </p>

        <span>Provérbios 21:5</span>

    </div>

</div>

<div class="lado-direito">

    <div class="card-cadastro">

        <h2>Alterar Senha</h2>

        <form action="/esqueci_senha" method="POST">


            <input
                type="password"
                name="nova_senha"
                placeholder="Nova Senha"
                required>

            <button type="submit">
                Entrar
            </button>


        </form>
    
    </div>

</div>


</div>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}
</script>

<div id="toast-container"></div>

<script>
function showToast(category, message) {
    const container = document.getElementById("toast-container");

    const toast = document.createElement("div");

    toast.classList.add("toast", category);

    toast.innerText = message;

    container.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 4000);
}

const flaskMessages = [
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        {category: "{{ category }}", message: "{{ message }}"},
    {% endfor %}
    {% endwith %}
];

flaskMessages.forEach(msg => {
    showToast(msg.category, msg.message);
});
</script>

</body>
</html>
